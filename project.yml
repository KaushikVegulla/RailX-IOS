# XcodeGen spec for the RailX iOS app (Phase 1).
# Generate the Xcode project with:  xcodegen generate
# CI currently builds/tests the RailXCore SwiftPM package directly;
# the app target joins CI once the generated project is committed.
name: RailX
options:
  bundleIdPrefix: com.kaushikvegulla
  deploymentTarget:
    iOS: "17.0"
packages:
  RailXCore:
    path: .
targets:
  RailX:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: RailXCore
        product: RailXCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaushikvegulla.railx
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
