# XcodeGen spec for the RailX iOS app.
# Generate the Xcode project with:  xcodegen generate
# CI generates it fresh on the macOS runner and builds the app target
# for the iOS Simulator (unsigned).
name: RailX
options:
  bundleIdPrefix: com.kaushikvegulla
  deploymentTarget:
    iOS: "17.0"
packages:
  RailXCore:
    path: .
  Razorpay:
    url: https://github.com/razorpay/razorpay-pod
    from: 1.4.0
targets:
  RailX:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
    dependencies:
      - package: RailXCore
        product: RailXCore
      - package: Razorpay
        product: RazorpayCheckout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaushikvegulla.railx
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
