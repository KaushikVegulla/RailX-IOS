name: TestFlight (manual)

# Phase 4: archive with automatic signing via an App Store Connect API
# key and upload to TestFlight. Manual dispatch only — it runs when
# Kaushik starts it, after the repo secrets listed in TESTFLIGHT.md
# are set. Normal pushes never trigger this workflow.

on:
  workflow_dispatch:

jobs:
  upload-testflight:
    name: Archive + upload to TestFlight
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          missing=0
          for name in TEAM_ID KEY_ID ISSUER_ID KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repo secret for $name — see TESTFLIGHT.md"
              missing=1
            fi
          done
          exit $missing

      - name: Install App Store Connect API key
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          KEY_P8: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          ls -la ~/.appstoreconnect/private_keys

      - name: Generate Xcode project (XcodeGen)
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Prepare ExportOptions
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/__TEAM_ID__/${TEAM_ID}/g" ExportOptions.plist
          cat ExportOptions.plist

      - name: Archive (automatic signing via API key)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project RailX.xcodeproj \
            -scheme RailX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/RailX.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/RailX.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          ls -la build/export

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios \
            --file build/export/RailX.ipa \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Upload exported IPA as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railx-ios-testflight-ipa
          path: build/export/RailX.ipa
          if-no-files-found: ignore
